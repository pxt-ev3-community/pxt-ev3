name: Publish beta site

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pxt-ev3
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout translations
        uses: actions/checkout@v4
        with:
          repository: pxt-ev3-community/pxt-ev3-translations
          path: translations

      - name: Get GitHub Pages path
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Resolve and validate target version
        shell: bash
        run: |
          set -euo pipefail

          SEMVER_REGEX="^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$"

          # Base version always comes from package.json
          BASE_VERSION=$(node -p "require('./package.json').version")

          # Count commits since the release tag or the last commit that modified the "version": field in package.json
          if git rev-parse "v${BASE_VERSION}" >/dev/null 2>&1; then
            COMMITS_COUNT=$(git rev-list --count "v${BASE_VERSION}..HEAD")
          else
            LAST_BUMP_COMMIT=$(git log -n 1 --format="%H" --first-parent -m -G '"version":' -- package.json 2>/dev/null || true)
            COMMITS_COUNT=$(git rev-list --count "${LAST_BUMP_COMMIT}..HEAD" 2>/dev/null || echo 0)
          fi

          if [ "$COMMITS_COUNT" -eq 0 ]; then
            VERSION="$BASE_VERSION"
            echo "Bump or release commit detected; using clean version: $VERSION"
          else
            VERSION="${BASE_VERSION}-${COMMITS_COUNT}"
            echo "No bump in current commit; using version: $VERSION"
          fi

          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::Generated version '$VERSION' does not match SemVer format!"
            exit 1
          fi

          # Update the package for the PXT build
          npm pkg set "version=$VERSION"

          echo "Target version: $(node -p "require('./package.json').version")"
          echo "Source commit: $(git rev-parse HEAD)"

      - name: Install PXT globally
        run: npm install -g pxt

      - name: Install project dependencies
        run: npm install --ignore-scripts

      - name: Build static package
        run: ./build_static_package.sh ${{ steps.pages.outputs.base_path }}

      - name: Verify package output exists
        run: |
          test -d built/packaged
          test -f built/packaged/${{ steps.pages.outputs.base_path }}/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: built/packaged/${{ steps.pages.outputs.base_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
