name: Publish beta site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pxt-ev3
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout translations
        uses: actions/checkout@v4
        with:
          repository: pxt-ev3-community/pxt-ev3-translations
          path: translations

      - name: Get GitHub Pages path
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Resolve and validate target version
        shell: bash
        run: |
          set -euo pipefail

          SEMVER_REGEX="^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$"

          # Fallback version from package.json
          FALLBACK_VERSION=$(node -p "require('./package.json').version")

          # Try to get version with build number from git describe (e.g. v1.5.9-303-gcc88ae5)
          GIT_DESCRIBE=$(git describe --tags 2>/dev/null || true)
          CLEAN_VERSION="${GIT_DESCRIBE#v}"

          if [[ "$CLEAN_VERSION" =~ $SEMVER_REGEX ]]; then
            VERSION="$CLEAN_VERSION"
            echo "Using git describe version: $VERSION"
          elif [[ "$FALLBACK_VERSION" =~ $SEMVER_REGEX ]]; then
            VERSION="$FALLBACK_VERSION"
            echo "No valid git tag; fallback to package.json: $VERSION"
          else
            echo "::error::Could not resolve a valid SemVer target version!"
            exit 1
          fi

          # Update the package for the PXT build
          npm pkg set "version=$VERSION"

          echo "Target version: $(node -p "require('./package.json').version")"
          echo "Source commit: $(git rev-parse HEAD)"

      - name: Install PXT globally
        run: npm install -g pxt

      - name: Install project dependencies
        run: npm install --ignore-scripts

      - name: Build static package
        run: ./build_static_package.sh ${{ steps.pages.outputs.base_path }}

      - name: Verify package output exists
        run: |
          test -d built/packaged
          test -f built/packaged/${{ steps.pages.outputs.base_path }}/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: built/packaged/${{ steps.pages.outputs.base_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
